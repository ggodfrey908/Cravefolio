<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in | Cravefolio</title><link rel="icon" href="/favicon.ico"><style>:root{--green:#07543d;--cream:#faf8ef;--yellow:#ffc642}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--green);font-family:Arial,Helvetica,sans-serif}header{background:#fffdf7;border-bottom:1px solid #e0e7d9;padding:20px 24px}a{color:inherit}.logo{text-decoration:none;font-size:25px;font-weight:800}.logo span{color:#d99d00}main{max-width:850px;margin:45px auto;padding:0 24px 70px}h1{font:bold clamp(34px,5vw,48px) Georgia,serif}p{line-height:1.6}.panels{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px}.panel{background:#fffdf7;border:1px solid #e0e7d9;border-radius:16px;padding:24px}label{display:block;font-size:14px;font-weight:bold;margin:15px 0 7px}input{width:100%;padding:12px;border:1px solid #a8b9ab;border-radius:8px;font:inherit}button{border:0;background:var(--green);color:white;border-radius:9px;padding:12px 18px;font-weight:bold;cursor:pointer;margin-top:17px}button.secondary{background:var(--yellow);color:var(--green)}.status{margin:20px 0;padding:14px;background:#e8efdf;border-radius:8px;min-height:48px}.status.error{background:#ffe5df;color:#792a19}small{display:block;margin-top:12px;line-height:1.5}code{overflow-wrap:anywhere}</style>
</head><body><header><a class="logo" href="/">Crave<span>folio</span></a></header><main><h1>Your rewards, served.</h1><p>Create an account or sign in. The existing rewards inbox remains a separate demonstration; no real restaurant email is connected yet.</p><div id="status" class="status" role="status" aria-live="polite">Enter your details below.</div><div class="panels"><section class="panel"><h2>Sign in</h2><form id="signin"><label for="signin-email">Email</label><input id="signin-email" type="email" autocomplete="email" required><label for="signin-password">Password</label><input id="signin-password" type="password" autocomplete="current-password" required><button>Sign in</button></form><button type="button" class="secondary" id="reset">Forgot password?</button></section><section class="panel"><h2>Create account</h2><form id="signup"><label for="signup-email">Email</label><input id="signup-email" type="email" autocomplete="email" required><label for="signup-password">Password (at least 8 characters)</label><input id="signup-password" type="password" minlength="8" autocomplete="new-password" required><button>Create account</button></form><small>You may need to confirm your email before signing in.</small></section></div></main><script type="module" src="/auth.js"></script></body></html>
